# data/repo_skip_config.yaml
#
# Per-issue skip configuration for AST/freq/co-change map generation.
# Generated by scripts/generate_skip_config.py
#
# defaults.skip_dirs      — applied to every issue
# issues.<repo>/<idx>.extra_skip_dirs — additional dirs that exist
#                           at this specific base commit and should
#                           be excluded (vendored / build scaffolding)
#
# Effective skip_dirs = defaults.skip_dirs + extra_skip_dirs
#
# Skip-dir matching is by directory NAME (not path), so 'tests' skips
# any subdirectory named 'tests' anywhere inside the package walk.

defaults:
  skip_dirs:
  - __pycache__
  - build
  - dist
  - .eggs
  - .tox
  - venv
  - .venv
  - env
  - site-packages
  - tests
  - test
  - testing
  - docs
  - doc
  - documentation
  - examples
  - example
  - benchmarks
  - benchmark
  - scripts
