# data/repo_skip_config.yaml
#
# Per-issue skip configuration for AST/freq/co-change map generation.
#
# defaults.skip_dirs      — applied to every issue
# issues.<repo>/<idx>.extra_skip_dirs — additional dirs to exclude at a
#                           specific commit (vendored / auto-generated code)
#
# Effective skip_dirs = defaults.skip_dirs + extra_skip_dirs
#
# Skip-dir matching is by directory NAME (not path), so 'tests' skips
# any subdirectory named 'tests' anywhere inside the package walk.
# Extra dirs that don't exist at a given commit are silently ignored.
#
# Repos in study (15):
#   small  : requests, thefuck, flask, gpt-engineer, fastapi
#   medium : scrapy, rich, stable-diffusion-webui, keras, localstack
#   large  : yt-dlp, pandas, scikit-learn, transformers, core
#
# Issue indices refer to the positional index in the filtered pickle subset.

defaults:
  skip_dirs:
  - __pycache__
  - build
  - dist
  - .eggs
  - .tox
  - venv
  - .venv
  - env
  - site-packages
  - tests
  - test
  - testing
  - docs
  - doc
  - documentation
  - examples
  - example
  - benchmarks
  - benchmark
  - scripts

issues:

  # ── small: requests ────────────────────────────────────────────────────────
  # packages/ = vendored urllib3/chardet/poster at early commits; harmless skip
  # at newer commits where the dir is absent.

  requests/7:
    extra_skip_dirs:
    - packages
  requests/12:
    extra_skip_dirs:
    - packages
  requests/13:
    extra_skip_dirs:
    - packages

  # ── small: thefuck ────────────────────────────────────────────────────────
  # Audited at base_commit: rules/, specific/, system/, shells/, entrypoints/,
  # output_readers/ are all first-party thefuck source. No vendored code.

  thefuck/5:
    extra_skip_dirs: []
  thefuck/10:
    extra_skip_dirs: []
  thefuck/20:
    extra_skip_dirs: []

  # ── small: flask ──────────────────────────────────────────────────────────
  # Audited at base_commit: sansio/ and json/ are first-party Flask
  # subpackages (WSGI/ASGI-agnostic core, JSON handling). No vendored code.

  flask/3:
    extra_skip_dirs: []
  flask/18:
    extra_skip_dirs: []
  flask/6:
    extra_skip_dirs: []

  # ── small: gpt-engineer ───────────────────────────────────────────────────
  # Audited at base_commit: core/, applications/, tools/ are first-party.
  # preprompts/ contains extensionless prompt-template text files (no .py),
  # already excluded by the map generators' .py-only filter. No vendored code.

  gpt-engineer/9:
    extra_skip_dirs: []
  gpt-engineer/12:
    extra_skip_dirs: []
  gpt-engineer/11:
    extra_skip_dirs: []

  # ── small: fastapi ────────────────────────────────────────────────────────
  # Audited at base_commit: openapi/, dependencies/, security/, middleware/
  # are all first-party fastapi subpackages. No vendored code.

  fastapi/17:
    extra_skip_dirs: []
  fastapi/9:
    extra_skip_dirs: []
  fastapi/20:
    extra_skip_dirs: []

  # ── medium: scrapy ────────────────────────────────────────────────────────
  # xlib/ = vendored pydispatch + Twisted compat at older commits; safe to
  # include in all entries since it's absent at newer commits.
  # contrib/ and contrib_exp/ (scrapy/48) are deprecated-but-first-party
  # scrapy modules (pre-rename locations for middlewares/extensions), not
  # vendored — kept in full.

  scrapy/26:
    extra_skip_dirs:
    - xlib
  scrapy/48:
    extra_skip_dirs:
    - xlib
  scrapy/20:
    extra_skip_dirs:
    - xlib

  # ── medium: rich ──────────────────────────────────────────────────────────
  # Audited at base_commit: no subdirectories beyond source modules in the
  # package root. No vendored code.

  rich/8:
    extra_skip_dirs: []
  rich/12:
    extra_skip_dirs: []
  rich/1:
    extra_skip_dirs: []

  # ── medium: stable-diffusion-webui ────────────────────────────────────────
  # codeformer/ = external research project bundled in modules/; always present.

  stable-diffusion-webui/0:
    extra_skip_dirs:
    - codeformer
  stable-diffusion-webui/5:
    extra_skip_dirs:
    - codeformer
  stable-diffusion-webui/13:
    extra_skip_dirs:
    - codeformer

  # ── medium: keras ─────────────────────────────────────────────────────────
  # Audited at base_commit: layers/, backend/, engine/, applications/, utils/,
  # legacy/, preprocessing/, datasets/, wrappers/ are all first-party Keras
  # subpackages. No vendored code.

  keras/9:
    extra_skip_dirs: []
  keras/12:
    extra_skip_dirs: []
  keras/5:
    extra_skip_dirs: []

  # ── medium: localstack ────────────────────────────────────────────────────
  # Audited at base_commit: services/, utils/, aws/, cli/, contrib/, runtime/
  # are all first-party. dashboard/ mixes real .py source (api.py, infra.py)
  # with static web assets (css/js/img) that the map generators' .py-only
  # filter already excludes. No vendored code.

  localstack/2:
    extra_skip_dirs: []
  localstack/19:
    extra_skip_dirs: []
  localstack/9:
    extra_skip_dirs: []

  # ── large: yt-dlp ────────────────────────────────────────────────────────
  # extractor/ (1000+ files) is genuine source — every site extractor is
  # real first-party code central to the tool, not vendored; kept in full.
  # __pyinstaller/ = PyInstaller packaging hook (build scaffolding, not
  # runtime logic), same rationale as scikit-learn's __check_build/.

  yt-dlp/41:
    extra_skip_dirs:
    - __pyinstaller
  yt-dlp/45:
    extra_skip_dirs:
    - __pyinstaller
  yt-dlp/23:
    extra_skip_dirs:
    - __pyinstaller

  # ── large: pandas ─────────────────────────────────────────────────────────
  # Audited at base_commit: io/, core/, tseries/, tools/, stats/, sparse/,
  # computation/, util/, compat/, rpy/, sandbox/, _libs/, plotting/, etc. are
  # all first-party. src/ is mostly C/Cython (.c/.h/.pxd/.pyx, filtered out
  # by the .py-only map generators) plus one real .py file,
  # src/generate_code.py — which is the ground-truth file for pandas/35, so
  # src/ must NOT be skipped. No vendored code found.

  pandas/35:
    extra_skip_dirs: []
  pandas/44:
    extra_skip_dirs: []
  pandas/26:
    # Same top-level layout as pandas/35 (compat/, computation/, core/, io/,
    # rpy/, sandbox/, sparse/, src/, stats/, tools/, tseries/, util/); no
    # vendored code found at this commit either.
    extra_skip_dirs: []
  pandas/38:
    extra_skip_dirs: []

  # ── large: scikit-learn ───────────────────────────────────────────────────
  # externals/ = bundled joblib + six; __check_build/ and _build_utils/ =
  # build scaffolding. Safe to include across all commits.

  scikit-learn/49:
    extra_skip_dirs:
    - externals
    - __check_build
    - _build_utils
  scikit-learn/45:
    extra_skip_dirs:
    - externals
    - __check_build
    - _build_utils
  scikit-learn/5:
    extra_skip_dirs:
    - externals
    - __check_build
    - _build_utils

  # ── large: transformers ───────────────────────────────────────────────────
  # Audited at base_commit: models/ (400+ files) is genuine source — every
  # model architecture is real first-party code central to the library, not
  # vendored; kept in full. utils/, data/, pipelines/, commands/, onnx/,
  # sagemaker/ are all first-party too. No vendored code.

  transformers/25:
    extra_skip_dirs: []
  transformers/5:
    extra_skip_dirs: []
  transformers/27:
    extra_skip_dirs: []

  # ── large: core (home-assistant) ──────────────────────────────────────────
  # generated/ = 6k LOC of auto-generated lookup tables (config_flows,
  # entity_platforms, countries, currencies, etc.). Always present; always skip.
  # components/ (1000s of files) is genuine source — every integration is
  # real first-party code central to the framework, not vendored; kept in
  # full. helpers/, auth/, util/, auth_providers/ are all first-party too.
  #
  # core/17 and core/8 were dropped from the study (2026-07-12): both lost
  # ground truth to frequency-based pruning across compact/freq/cochange
  # maps at every budget tested — see DEVLOG.md. Replaced by core/20
  # (single) and pandas/26 (extra multi).

  core/16:
    extra_skip_dirs:
    - generated
  core/20:
    # Much earlier/smaller commit than core/16 — generated/ doesn't exist
    # yet at this point in the codebase's history. No vendored code found.
    extra_skip_dirs: []
